<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123463">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>逃出绝命课题组</title>
<style>
:root{
  --sys:#1b4b8f; --sys-deep:#123463; --sys-pale:#e6edf6; --rule:#c3cedc; --desk:#d9e0e8;
  --paper:#fff; --ink:#1f2329; --mute:#6b7785; --stamp:#c4161c; --ok:#2e7d4f;
  --chat:#ededed; --mine:#95ec69; --note:#fff6c9;
  --song:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  --hei:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font:15px/1.6 var(--hei);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sys);outline-offset:2px}
#app{max-width:440px;height:100%;margin:0 auto;background:var(--paper);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--rule)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* —— 管理系统皮肤 —— */
.sys{background:var(--sys-pale);min-height:100%;padding-bottom:24px}
.sys-top{background:var(--sys-deep);color:#fff;padding:10px 16px;font:600 15px/1.4 var(--song);letter-spacing:.08em;border-bottom:3px solid #b8892b}
.sys-top small{display:block;font:11px/1.4 var(--hei);letter-spacing:0;opacity:.7;font-weight:400}
.crumb{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--mute);padding:6px 16px;border-bottom:1px solid var(--rule);background:#f4f7fb}
.crumb span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb button{flex:none;color:var(--sys);font-size:12px;padding:3px 0 3px 8px;text-decoration:underline}
.status .term i{font-style:normal}
@media (max-width:360px){.status .term i{display:none}.acad{font-size:10px;padding:1px 4px}}
.dm-top .back{flex:none;width:24px;height:30px;margin-left:-6px;font-size:24px;line-height:26px;color:var(--mute)}
.status .back{flex:none;width:26px;height:26px;margin-left:-6px;font-size:24px;line-height:22px;color:var(--mute)}
.panel{margin:14px 12px 0;background:#fff;border:1px solid var(--rule)}
.panel h2{margin:0;padding:8px 12px;font:600 14px/1.4 var(--song);background:linear-gradient(#f7f9fc,#e9eff7);border-bottom:1px solid var(--rule);color:var(--sys-deep)}
.panel .body{padding:12px}
table.form{width:100%;border-collapse:collapse;font-size:14px}
table.form th,table.form td{border:1px solid var(--rule);padding:7px 10px;text-align:left;vertical-align:top}
table.form th{width:6.2em;background:#f4f7fb;font-weight:400;color:var(--mute);white-space:nowrap}
.btn{display:block;width:calc(100% - 24px);margin:16px 12px 0;padding:11px;background:var(--sys);color:#fff;text-align:center;border-radius:2px;font-size:15px}
.btn:active{background:var(--sys-deep)}
.btn.ghost{background:#fff;color:var(--sys);border:1px solid var(--sys)}
.btn[disabled]{opacity:.45;cursor:default}
.pass{color:var(--ok);font-weight:600}.fail{color:var(--stamp);font-weight:600}
.pending{color:var(--mute)}
.pending::after{content:"…";animation:dots 1.2s steps(3,end) infinite;display:inline-block;width:1.2em;overflow:hidden;vertical-align:bottom}
@keyframes dots{from{width:0}to{width:1.2em}}
.stampbox{height:130px;display:flex;align-items:center;justify-content:center}
.stamp{font:700 30px/1 var(--song);color:var(--stamp);border:4px solid var(--stamp);border-radius:8px;padding:12px 20px;letter-spacing:.2em;transform:rotate(-9deg);opacity:.88;
  animation:stamp .28s cubic-bezier(.2,1.6,.4,1) both;mix-blend-mode:multiply}
.stamp.round{border-radius:50%;width:112px;height:112px;display:flex;align-items:center;justify-content:center;padding:0;font-size:22px;text-align:center;line-height:1.25;letter-spacing:.1em}
.stamp.okc{color:var(--sys);border-color:var(--sys)}
@keyframes stamp{from{transform:rotate(-9deg) scale(2.4);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:.88}}
.attr{display:flex;gap:6px;margin:2px 0}.attr b{font-weight:400;width:3em;color:var(--mute)}
.pips i{display:inline-block;width:11px;height:11px;border:1px solid var(--sys);margin-right:3px;vertical-align:-1px}.pips i.on{background:var(--sys)}
.tag{display:inline-block;border:1px solid var(--rule);padding:1px 8px;margin:0 6px 6px 0;font-size:13px;background:#f4f7fb}
.tag small{color:var(--mute);margin-left:6px}
.hint{font-size:12px;color:var(--mute);margin:8px 12px 0}

/* —— 标题页 —— */
.title{flex:1;display:flex;flex-direction:column;justify-content:center;background:var(--sys-deep);color:#fff;padding:0 28px}
.title h1{font:700 44px/1.15 var(--song);margin:0 0 18px;letter-spacing:.04em}
.title h1 span{display:block}
.title p{margin:0 0 36px;opacity:.75;font-size:14px;max-width:18em}
.title .btn{width:100%;margin:0 0 12px;background:#fff;color:var(--sys-deep)}
.title .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.title .door{position:absolute;right:-30px;top:8%;width:150px;height:260px;border:2px solid rgba(255,255,255,.16);border-right:0}
.title .door::after{content:"";position:absolute;left:14px;top:50%;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3)}

/* —— 封面：凌晨的锁屏 —— */
.cover{flex:1;display:flex;flex-direction:column;justify-content:flex-start;background:linear-gradient(#0a1830,#123463 55%,#0d2547);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 22px calc(16px + env(safe-area-inset-bottom));overflow-y:auto;animation:buzz .45s .75s 1}
@keyframes buzz{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.cover-in{margin:auto 0 0;display:flex;flex-direction:column;width:100%}
.cover{scrollbar-width:none}.cover::-webkit-scrollbar{display:none}
.cover.fit1 .n3{display:none}.cover.fit2 .pool{display:none}
.cover .lock{text-align:center;margin:0 0 12px}
.cover .lock b{display:block;font:200 clamp(52px,17vw,68px)/1 -apple-system,"PingFang SC",sans-serif;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.cover .lock span{display:block;font-size:13px;opacity:.7;margin-top:4px}
.cover .notes{display:grid;grid-template-columns:minmax(0,1fr);gap:7px;margin-bottom:18px}
.cover .nt{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.14);border-radius:14px;padding:9px 12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:drop .4s cubic-bezier(.2,1.2,.4,1) both}
.cover .n1{animation-delay:.6s;background:rgba(255,255,255,.22)}.cover .n2{animation-delay:1.3s}.cover .n3{animation-delay:.1s;opacity:.75}
@keyframes drop{from{opacity:0;transform:translateY(-16px) scale(.96)}}
.cover .nt .ic{flex:none;width:30px;height:30px;border-radius:7px;background:#8d939c;position:relative;margin-top:2px}
.cover .nt .ic.wx{background:#07c160}
.cover .nt .ic::after{content:"";position:absolute;left:7px;top:8px;width:16px;height:12px;border-radius:6px;background:#fff}
.cover .nt div{flex:1;min-width:0}
.cover .nt b{font-size:13.5px;font-weight:600}
.cover .nt p{margin:1px 0 0;font-size:14px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover .nt time{font-size:11.5px;opacity:.6;white-space:nowrap}
.cover .hook{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.cover .hook em{flex:none;font:700 13px/1 var(--hei);font-style:normal;background:var(--stamp);color:#fff;padding:5px 7px;transform:rotate(-3deg);white-space:nowrap}
.cover .hook span{font:600 16px/1.45 var(--hei);color:#ffe9a8}
.cover h1{font:700 clamp(38px,12.5vw,50px)/1.1 var(--song);margin:0 0 12px;letter-spacing:.03em}
.cover .facts{list-style:none;display:flex;gap:0;margin:0 0 14px;padding:0;font-size:12px;color:rgba(255,255,255,.7)}
.cover .facts li{flex:1;border-left:1px solid rgba(255,255,255,.2);padding-left:9px}
.cover .facts li:first-child{border-left:0;padding-left:0}
.cover .facts b{display:block;font:700 24px/1.1 var(--song);color:#fff}
.cover .pool{margin:0 0 14px}
.cover .btn{width:100%;margin:0 0 9px;background:#fff;color:var(--sys-deep);font-weight:600;border-radius:8px;padding:13px}
.cover .btn small{display:block;font-size:11.5px;font-weight:400;opacity:.6;margin-top:1px}
.cover .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4);font-weight:400}
.cover .foot{margin:4px 0 0;font-size:11.5px;opacity:.55;text-align:center}
@media (max-height:700px){.cover .n3,.cover .pool{display:none}.cover .lock b{font-size:44px}.cover .notes{margin-bottom:12px}.cover h1{font-size:38px}.cover{padding-top:calc(12px + env(safe-area-inset-top))}}
@media (max-height:600px){.cover .lock span,.cover .n2{display:none}.cover h1{font-size:32px;margin-bottom:8px}.cover .lock b{font-size:36px}.cover .facts b{font-size:20px}}
@media (orientation:landscape) and (max-height:560px){.cover .notes{grid-template-columns:1fr 1fr}.cover-in{max-width:560px;margin-left:auto;margin-right:auto}}

/* —— 回合：状态栏 —— */
.status{background:#f7f7f7;border-bottom:1px solid #dcdcdc;padding:8px 12px 9px;font-size:12.5px}
.status .row{display:flex;align-items:center;gap:10px}
.status .term{font-weight:600;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .file.hole{color:#fff;border-color:#7a5a3c;background:#7a5a3c;animation:holeon 1.6s ease-in-out 3}
@keyframes holeon{50%{box-shadow:0 0 0 5px rgba(122,90,60,.25)}}
.hform textarea{display:block;width:100%;border:1px solid #d5d5d5;border-radius:5px;padding:9px 10px;font:inherit;font-size:16px;resize:none;background:#fff}
.hform button{display:block;width:100%;margin:8px 0 12px;background:#7a5a3c;color:#fff;border-radius:5px;padding:10px}
.hpost{border-top:1px solid #eee;padding:10px 0}
.hpost .hw{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}.hpost .hw b{font-weight:600;color:#7a5a3c}
.hpost p{margin:4px 0 0;font-size:14.5px;line-height:1.6;white-space:pre-line;word-break:break-word}
.hpost .hr{margin-top:6px;background:#f7f7f7;border-radius:4px;padding:5px 9px;font-size:13px;color:#555}
.hpost .hr.ok{background:#eef7f0;color:var(--ok)}
.status .file{color:var(--sys);border:1px solid var(--sys);padding:1px 8px;border-radius:2px;font-size:12px;white-space:nowrap}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;margin-top:7px}
.bar{display:flex;align-items:center;gap:6px;white-space:nowrap}
.bar label{color:var(--mute);width:4.2em;flex:none}
.bar .track{flex:1;height:7px;background:#dfe3e8;position:relative;border-radius:1px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--sys);border-radius:1px;transition:width .4s}
.bar .fill.san{background:#3a9d6a}.bar .fill.low{background:var(--stamp)}
.bar .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--stamp)}
.bar .cp{position:absolute;top:0;bottom:0;width:1px;background:#fff}
.bar span{width:2.2em;text-align:right;font-variant-numeric:tabular-nums}
.mood{color:var(--mute)}
.look{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:6px;padding-top:5px;border-top:1px dashed #d5d9de;font-size:12px;color:var(--mute)}
.look b{font-weight:700}.look .ok{color:var(--ok)}.look .mid{color:#b8892b}.look .bad{color:var(--stamp)}
.pcard{margin:2px auto 14px;width:76%;transform:rotate(-1.6deg)}
.pcard .pc{background:#fff;padding:7px 7px 9px;box-shadow:0 3px 12px rgba(0,0,0,.18)}
.pcard .pc p{margin:7px 2px 0;font:13.5px/1.55 "Kaiti SC","STKaiti","KaiTi",var(--song);color:#444}
.pcard small{display:block;text-align:center;font-size:12px;color:var(--ok);margin-top:6px;transform:rotate(1.6deg)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cards figure{margin:0;background:#fff;padding:3px 3px 4px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.cards figcaption{font-size:11.5px;text-align:center;margin-top:3px;color:#555}
.cards .no{background:#f1f3f6;box-shadow:none;border:1px dashed #c9cdd3}.cards .no div{aspect-ratio:280/160}.cards .no figcaption{color:#aab2bc}
.board .book button{font-size:13px}
.mile{margin:0 30px 12px;background:#eef7f0;border-left:3px solid var(--ok);padding:8px 11px;font:14px/1.6 var(--song)}
.mile small{display:block;font:600 11.5px var(--hei);color:var(--ok);margin-bottom:2px}
.bub.voice{display:flex;align-items:center;gap:3px;min-width:70px;max-width:190px}
.bub.voice i{display:block;width:3px;border-radius:2px;background:#8a8a8a;height:8px}.bub.voice i:nth-child(2){height:13px}.bub.voice i:nth-child(3){height:17px}
.bub.voice span{margin-left:6px;color:#666;font-size:13px}
.trans{margin-top:4px;background:#f7f7f7;border-radius:5px;padding:6px 10px;font-size:13.5px;color:#444;max-width:100%}
.trans small{display:block;font-size:11px;color:#9a9a9a}
.acad{color:#fff;background:var(--stamp);font-size:11px;padding:1px 6px;border-radius:2px;white-space:nowrap}

/* —— 回合：群聊 —— */
.chat{flex:1;overflow-y:auto;background:var(--chat);padding:10px 10px 16px}
.banner{text-align:center;margin:4px 0 10px}
.banner span{background:#dadada;color:#fff;font-size:12px;padding:2px 10px;border-radius:3px}
.msg{display:flex;gap:8px;margin:0 0 10px;align-items:flex-start}
.msg .av{flex:none;width:36px;height:36px;border-radius:4px;background:#8a9bb0;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
.msg.mentor .av{background:var(--sys-deep)}
.msg.sysmsg .av{background:#b8892b}
.msg .who{font-size:12px;color:#888;margin-bottom:2px}
.msg .bub{background:#fff;padding:8px 11px;border-radius:5px;max-width:268px;white-space:pre-line;word-break:break-word}
.msg.me{flex-direction:row-reverse}.msg.me .bub{background:var(--mine)}.msg.me .av{background:#e8843c}
.msg .t{font-size:12px;color:#8a8a8a;margin-top:3px}
.pick{margin:0;max-width:calc(100% - 52px)!important;width:fit-content;text-align:right}
.msg.pickrow{margin-bottom:12px;align-items:flex-start}
.pick small{display:block;font-size:11px;color:#9a9a9a;margin-bottom:3px;letter-spacing:.08em}
.pick b{display:inline-block;font-weight:500;text-align:left;background:#f7f7f7;border:1px solid #cfcfcf;border-right:3px solid #e8843c;border-radius:4px;padding:6px 11px;color:var(--ink)}
.pick .t{font-size:12px;color:#8a8a8a;margin-top:4px}
.msg.gone .av{background:#c4c4c4}
.msg .bub.typing{padding:11px 14px}
.msg.mad .bub{transform:rotate(-1.4deg);letter-spacing:.14em;background:#f1eefc;box-shadow:2px 2px 0 #d9d2f0}
.dm{position:absolute;inset:0;z-index:6;background:var(--chat);display:flex;flex-direction:column}
.dm.in{animation:dmin .22s ease-out}
@keyframes dmin{from{transform:translateX(24px);opacity:0}}
.dm-top{display:flex;align-items:center;gap:10px;background:#f7f7f7;border-bottom:1px solid #dcdcdc;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.dm-top .av{width:34px;height:34px;border-radius:4px;flex:none}.dm-top .av.out svg{filter:grayscale(1) brightness(.75)}
.dm-top b{font-size:16px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-top small{font-size:12px;color:#fff;background:#07c160;border-radius:2px;padding:1px 7px}
.dm-body{flex:1;overflow-y:auto;padding:12px 10px}
.dm .opt small{display:block;color:var(--mute);font-size:12px}
.busy{position:absolute;inset:0;z-index:9;background:rgba(237,237,237,.72);display:flex;align-items:flex-end;justify-content:center;z-index:9;padding-bottom:26%;animation:busyin .15s}
.busy-card{background:#fff;border-radius:10px;padding:16px 22px 14px;min-width:230px;max-width:80%;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.12);font-size:14px;color:#555}
.busy-dots{display:inline-flex;gap:5px;vertical-align:middle}
.busy-card .busy-dots{margin-bottom:8px}
.busy-dots i{width:7px;height:7px;border-radius:50%;background:#9aa3ad;animation:bounce 1s infinite ease-in-out}
.busy-dots i:nth-child(2){animation-delay:.15s}.busy-dots i:nth-child(3){animation-delay:.3s}
.busy-bar{height:2px;background:#eceff2;margin-top:12px;overflow:hidden;border-radius:1px}
.busy-bar i{display:block;height:100%;width:35%;background:#07c160;animation:slide 1.3s infinite ease-in-out}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}
@keyframes slide{from{transform:translateX(-110%)}to{transform:translateX(300%)}}
@keyframes busyin{from{opacity:0}to{opacity:1}}
.moments{margin:0 10px 12px;background:#fff;border-radius:5px;padding:8px 12px;font-size:13.5px}
.moments small{color:#999;font-size:12px}
.moments p{margin:4px 0 0}.moments b{color:#576b95;font-weight:500}
.nar{margin:0 26px 10px;text-align:center;font-size:13px;color:#757575;white-space:pre-line}
.nar.big{color:var(--ink);font-size:14px;background:#e2e2e2;padding:8px 10px;border-radius:4px}
.nar .t{display:block;font-size:12px;color:#999}
.note{margin:0 34px 10px;background:var(--note);padding:8px 10px;font:14px/1.5 "Kaiti SC","STKaiti","KaiTi",var(--song);transform:rotate(-.6deg);box-shadow:1px 1px 0 #e4d98f}
.note small{display:block;font:11px var(--hei);color:#9a8a2c;margin-bottom:2px}
.delta{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 2px}
.delta span{background:#fff;border-radius:3px;padding:2px 8px;font-size:12.5px;font-variant-numeric:tabular-nums}
.delta .up{color:var(--ok)}.delta .down{color:var(--stamp)}

/* —— 回合：底部操作 —— */
.dock{border-top:1px solid #dcdcdc;background:#f7f7f7;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
.dockwait{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--mute);font-size:13.5px;padding:18px 0}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid #d5d5d5;border-radius:5px;padding:9px 12px;margin-bottom:7px}
.opt:last-child{margin-bottom:0}
.opt:active{background:#e9f7df}
.opt[disabled]{color:#b5b5b5;background:#f1f1f1;text-decoration:line-through;cursor:default}
.opt.warp{text-shadow:1px 0 0 rgba(196,22,28,.35),-1px 0 0 rgba(27,75,143,.35);animation:jit 3.5s steps(2) infinite}
.lowsan{font-size:12px;color:var(--stamp);margin:0 2px 7px}
@keyframes jit{0%,92%{transform:none}94%{transform:translateX(1.5px) skewX(-3deg)}97%{transform:translateX(-1px)}}
.aphead{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px}
.dots i{display:inline-block;width:13px;height:13px;border-radius:50%;background:#c9c9c9;margin-right:4px;vertical-align:-2px}
.dots i.on{background:#e8843c}
.aphead .free{margin-left:auto;color:var(--mute)}
.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.cell{background:#fff;border:1px solid #d5d5d5;border-radius:5px;padding:6px 6px 7px;text-align:center;min-width:0}
.cell.has{border-color:#e8843c}
.cell .nm{font-size:13.5px;white-space:nowrap}.cell .sub{font-size:11px;color:var(--mute);height:1.5em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .pm{display:flex;align-items:center;justify-content:space-between;margin-top:3px}
.cell .pm button{width:30px;height:28px;border:1px solid #d5d5d5;border-radius:4px;font-size:17px;line-height:1;background:#fafafa}
.cell .pm button[disabled]{opacity:.3}
.cell .pm b{font-size:16px;font-variant-numeric:tabular-nums}
.ainote{font-size:12px;color:var(--mute);margin-top:8px}
.free{display:flex;gap:6px;margin-top:2px}
.free input{flex:1;min-width:0;border:1px solid #d5d5d5;border-radius:5px;padding:8px 10px;font:inherit;background:#fff}
.free button{background:#07c160;color:#fff;border-radius:5px;padding:0 14px}
.free button[disabled]{opacity:.5}
.seg{display:flex;margin-top:8px;border:1px solid #d5d5d5;border-radius:5px;overflow:hidden;background:#fff;font-size:12.5px}
.seg span{padding:5px 8px;color:var(--mute);border-right:1px solid #d5d5d5;white-space:nowrap}
.seg button{flex:1;padding:5px 2px;border-right:1px solid #d5d5d5}.seg button:last-child{border:0}
.seg button.on{background:#1f2329;color:#fff}
.who-row{display:flex;gap:6px;margin-top:8px;font-size:12.5px;align-items:center;flex-wrap:wrap}
.restdir{display:flex;align-items:baseline;gap:8px;margin-top:12px}.restdir b{font:600 15px var(--song)}.restdir span{font-size:12px;color:var(--mute)}
.who-row button{border:1px solid #d5d5d5;background:#fff;border-radius:12px;padding:2px 10px}.who-row button.on{border-color:#e8843c;color:#c8641c}
.go{display:block;width:100%;margin-top:9px;background:#07c160;color:#fff;border-radius:5px;padding:10px;font-size:15px}
.go:active{background:#06ad56}

/* —— 弹层 —— */
.mask{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:5}
.sheet{background:#fff;width:100%;max-height:86%;overflow-y:auto;border-radius:10px 10px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font:600 17px/1.4 var(--song)}
.sheet p.q{margin:0 0 12px;color:var(--mute);font-size:13px}
.sheet .opt small{display:block;color:var(--mute);font-size:12px}
.fold{border-top:1px solid #e3e6ea}
.fold summary{list-style:none;display:flex;align-items:baseline;gap:8px;padding:12px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.fold summary::-webkit-details-marker{display:none}
.fold summary span{font:600 16px/1.4 var(--song);white-space:nowrap}
.fold summary small{flex:1;min-width:0;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fold summary::after{content:"展开";font-size:12px;color:var(--sys);border:1px solid var(--sys);border-radius:2px;padding:0 7px}
.fold[open] summary::after{content:"收起";color:var(--mute);border-color:#c9cdd3}
.fold .in{padding-bottom:14px}
.fold .peer:first-child{border-top:0}
.peer{display:flex;gap:10px;padding:8px 0;border-top:1px solid #eee;align-items:center}
.peer .av{width:34px;height:34px;border-radius:4px;background:#8a9bb0;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.peer.out .av{background:#c9c9c9}.peer .info{flex:1;min-width:0;font-size:13px}.peer .info small{color:var(--mute);display:block}
.peer .rel{font-size:12px;color:var(--mute);white-space:nowrap}

/* —— 致谢页与分享卡 —— */
.thesis-page{background:#fbfaf6;margin:14px 12px 0;padding:34px 26px 40px;border:1px solid #e3dfd2;font:16px/2 var(--song);min-height:300px}
.thesis-page h2{text-align:center;font:700 20px/1.6 var(--hei);letter-spacing:1em;margin:0 0 20px;text-indent:1em}
.thesis-page p{margin:0;text-indent:2em;white-space:pre-line}
.thesis-page .pn{text-align:center;font-size:12px;color:var(--mute);margin-top:28px;text-indent:0}
.card{margin:14px 12px 0;background:#fbfaf6;border:1px solid #1f2329;padding:20px 20px 16px;aspect-ratio:3/4;display:flex;flex-direction:column}
.card .k{font:12px var(--hei);color:var(--mute)}
.card h2{font:700 28px/1.25 var(--song);margin:4px 0 12px}
.card .tx{font:14px/1.85 var(--song);white-space:pre-line;flex:1;overflow:hidden}
.card-wrap .grade{position:absolute;right:28px;top:18px}
.card .ft{border-top:1px solid #1f2329;padding-top:8px;font-size:12px;display:flex;justify-content:space-between;gap:8px}
.card-wrap{position:relative}
.book{display:flex;border-bottom:1px solid var(--rule);background:#f4f7fb}
.book button{flex:1;padding:9px 0;font-size:14px;color:var(--mute)}.book button.on{color:var(--sys-deep);font-weight:600;box-shadow:inset 0 -2px var(--sys)}
/* —— 美术：低多边形人物、场景、章 —— */
.art{display:block;width:100%;height:auto}
.av.pic{background:#3a3c40!important;overflow:hidden;padding:0}
.av.pic svg{width:100%;height:100%;display:block}
.msg.gone .av.pic svg,.peer.out .av.pic svg{filter:grayscale(1) brightness(.75)}
.lbl{display:inline-block;background:#fff;color:#1f2329;font:700 16px/1 var(--hei);padding:6px 9px;position:relative}
.portrait{background:#3a3c40;padding:14px 12px 12px;text-align:center}
.portrait .art{width:min(168px,48%);margin:0 auto}
.portrait .lbl{margin-top:-4px}
.portrait.sil{position:relative}
.portrait.sil .art{filter:brightness(0) invert(.3)}
.portrait.sil::before{content:"？";position:absolute;left:0;right:0;top:34%;font:700 40px/1 var(--song);color:#fff;opacity:.85;z-index:1}
.portrait.reveal .art{animation:reveal 1.1s ease-out both}
.av.pic.sil{background:var(--sys-deep)!important}
.av.pic.sil svg{filter:brightness(0) invert(.55)}
.plate{background:#2f3134;margin:12px 12px 0;padding:10px;color:#e8eaed}
.plate .lbl{margin-top:8px}
.plate p{margin:8px 0 0;font:14px/1.75 var(--song);white-space:pre-line}
.plate.reveal .art{animation:reveal .9s ease-out both}
@keyframes reveal{from{opacity:0;filter:brightness(2.2) saturate(0);transform:scale(1.04)}to{opacity:1;filter:none;transform:none}}
.plate.locked>.art{filter:grayscale(1) brightness(.4) contrast(.75) blur(2.5px)}
.plate.locked .lbl{background:#111;color:#9aa0a8}
.plate.locked p{color:#9aa0a8}
.board{background:#3a3c40;min-height:100%;padding-bottom:28px}
.board-top .back{flex:none;align-self:center;width:30px;height:32px;margin:0 2px 0 -8px;font-size:28px;line-height:28px;color:#fff;opacity:.85}
.board-top b{flex:1}
.board-top{display:flex;align-items:baseline;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;color:#fff}
.board-top b{font:700 22px/1.2 var(--song);letter-spacing:.1em}.board-top span{font-size:12.5px;color:#b9bfc7;font-variant-numeric:tabular-nums}
.board-head{position:sticky;top:0;z-index:2;background:#3a3c40;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.board .book{background:#2f3134;border:0}
.board .book button{color:#9aa0a8;padding:11px 0}.board .book button.on{color:#fff;box-shadow:inset 0 -3px #fff}
.board .btn.ghost{background:transparent;color:#fff;border-color:#8d939c}
.mcard{display:grid;grid-template-columns:112px minmax(0,1fr);gap:4px 12px;align-items:start}
.mcard .ph{position:relative;overflow:hidden}
.mcard .lbl{font-size:15px;margin-top:-4px}
.mcard.locked .ph i{position:absolute;left:30%;right:26%;top:40%;height:13%;background:#111}
.mcard.locked .ph .art{filter:grayscale(1) brightness(.5) contrast(.7)}
.mcard dl{margin:0;font-size:13px}
.mcard dt{color:#9aa0a8;font-size:12px;margin-top:8px}.mcard dt:first-child{margin-top:0}
.mcard dd{margin:0;font:14px/1.55 var(--song)}
.mfold{grid-column:1/-1;border-top:1px solid #45484d;margin-top:8px}
.mfold summary{list-style:none;display:flex;align-items:baseline;gap:8px;padding:9px 0 2px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mfold summary::-webkit-details-marker{display:none}
.mfold summary span{font-size:13.5px;color:#fff;white-space:nowrap}
.mfold summary small{flex:1;min-width:0;font-size:11.5px;color:#9aa0a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mfold summary::after{content:"展开";font-size:11.5px;color:#c9cdd3;border:1px solid #6b7078;border-radius:2px;padding:0 6px}
.mfold[open] summary::after{content:"收起"}
.mdetail{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px;align-items:center;padding-top:6px}
.radar{width:100%;display:block}
.mdetail p{margin:0 0 6px;font-size:13.5px;line-height:1.5}
.redpen{color:#ff9b8f;font-family:"Kaiti SC","STKaiti","KaiTi",var(--song)}
.unk{color:#7d838b}
.seals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 8px;padding:16px 12px 0;text-align:center;color:#e8eaed}
.seals .art{width:82%;margin:0 auto;transform:rotate(-6deg)}
.seals .lbl{font-size:13px;margin-top:8px}
.seals small{display:block;color:#b9bfc7;font-size:12px;margin-top:5px;line-height:1.4}
.seals .locked .art{filter:grayscale(1) brightness(.32) contrast(.6)}
.seals .locked .lbl{background:#111;color:#9aa0a8}
.minis{display:inline-block;width:34px;height:34px;vertical-align:middle;margin-right:8px;background:#3a3c40;border-radius:4px;overflow:hidden}
.minis svg{width:100%;height:100%}
.got{display:flex;gap:12px;background:#3a3c40;padding:10px;margin-top:10px;justify-content:center}
.got>div{width:96px}
.card{aspect-ratio:auto}
.card>.art{margin:-20px -20px 14px;width:calc(100% + 40px)}
.card .tx{margin-bottom:14px}
.card-wrap .grade{top:calc((min(100vw,440px) - 24px)*.5714 + 22px);right:24px}
.card h2{padding-right:64px}
.mood i{font-style:normal}
@media (max-width:420px){.status .mood{display:none}.status .row{gap:6px}}
.pool{display:flex;gap:6px;margin:-18px 0 30px}
.pool span{flex:1;max-width:44px;aspect-ratio:1;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
.pool svg{width:100%;height:100%;display:block}
.pool .un svg{filter:brightness(0);opacity:.35}

/* —— 动效：数值飘字、消息逐条出现 —— */
.bar{position:relative}
.fl{position:absolute;right:2.6em;top:-9px;font:700 12px/1 var(--hei);font-style:normal;pointer-events:none;animation:fl 1.5s ease-out both;text-shadow:0 0 3px #f7f7f7,0 0 3px #f7f7f7,0 0 3px #f7f7f7}
.fl.up{color:var(--ok)}.fl.down{color:var(--stamp)}
@keyframes fl{0%{opacity:0;transform:translateY(7px)}15%,70%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-9px)}}
.bar span.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.4)}}
.chat>.in{animation:msgin .3s ease-out both}
.chat{position:relative}
.more{position:sticky;bottom:0;height:0;text-align:center;z-index:2;animation:none!important}
.more button{position:relative;top:-34px;background:rgba(31,35,41,.82);color:#fff;font-size:12.5px;padding:6px 14px;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
@keyframes msgin{from{opacity:0;transform:translateY(9px)}}

/* —— 过渡动画 —— */
/* 1 换周: 旧消息向上滑走，闪过一张日历页 */
#app.lv-week .chat{transition:transform .24s ease-in,opacity .24s;transform:translateY(-26px);opacity:0}
#app.lv-week .dock{transition:opacity .24s;opacity:.3}
.weekcard{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;background:rgba(237,237,237,.97);pointer-events:none;animation:wkbg .6s ease both}
.weekcard div{width:168px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.16);text-align:center;animation:wkflip .6s cubic-bezier(.2,.9,.3,1) both;transform-origin:top center}
.weekcard small{display:block;background:var(--stamp);color:#fff;font-size:13px;padding:6px 0;letter-spacing:.2em}
.weekcard b{display:block;font:700 54px/1.25 var(--song);color:var(--ink);padding-top:6px}
.weekcard span{display:block;font-size:13px;color:var(--mute);padding:0 0 14px}
@keyframes wkbg{0%{opacity:0}14%,68%{opacity:1}100%{opacity:0;visibility:hidden}}
@keyframes wkflip{0%{transform:perspective(600px) rotateX(-70deg);opacity:0}22%{transform:perspective(600px) rotateX(0);opacity:1}70%{transform:none;opacity:1}100%{transform:translateY(-18px);opacity:0}}
/* 2 封面: 像解锁手机一样向上划开 */
#app.lv-unlock .cover{transition:transform .38s cubic-bezier(.5,0,.85,.4),opacity .38s;transform:translateY(-100%);opacity:.4;animation:none}
.en-up{animation:enup .34s ease-out both}
@keyframes enup{from{opacity:0;transform:translateY(22px)}}
/* 4 去关卡: 群聊退后，申请表从下面推上来 */
#app.lv-gate .chat,#app.lv-gate .status,#app.lv-gate .dock{transition:transform .26s ease-in,opacity .26s;transform:scale(.95);opacity:.25}
.en-rise{animation:enrise .42s cubic-bezier(.2,.9,.3,1) both}
@keyframes enrise{from{transform:translateY(46px);opacity:0}}
/* 5 弹出的面板: 从底部滑上来，关的时候滑下去 */
.mask.in{animation:maskin .2s ease-out both}
.mask.in .sheet{animation:sheetup .3s cubic-bezier(.2,.9,.3,1) both}
.mask.out{animation:maskin .18s ease-in reverse both}
.mask.out .sheet{animation:sheetup .18s ease-in reverse both}
@keyframes maskin{from{background:rgba(0,0,0,0)}}
@keyframes sheetup{from{transform:translateY(100%)}}
/* 7 里程碑打勾；明信片像照片一样甩到桌上 */
.chat>.mile.in{animation-name:milein;animation-duration:.4s}
@keyframes milein{from{opacity:0;transform:translateX(-14px)}}
.mile small::before{content:"✓";display:inline-block;width:15px;height:15px;line-height:15px;text-align:center;border-radius:50%;background:var(--ok);color:#fff;font-size:10px;margin-right:6px;vertical-align:1px}
.chat>.mile.in small::before{animation:pop .45s cubic-bezier(.2,1.8,.4,1) both;animation-delay:calc(var(--d,0s) + .3s)}
@keyframes pop{from{transform:scale(0)}}
.chat>.pcard.in{animation-name:toss;animation-duration:.6s;animation-timing-function:cubic-bezier(.2,1.3,.4,1)}
@keyframes toss{from{opacity:0;transform:translateY(-36px) rotate(9deg) scale(1.12)}to{opacity:1;transform:rotate(-1.6deg)}}
/* 8 学业预警砸下来；被清退时整屏褪色 */
.acad.slam{animation:slam .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{from{transform:scale(2.6) rotate(-8deg);opacity:0}}
.status.flash{animation:flashred .7s ease-out}
@keyframes flashred{0%{background:#f6c9c9}100%{background:#f7f7f7}}
#app.lv-wash>*{transition:filter .9s ease-in,opacity .9s ease-in;filter:grayscale(1) brightness(.55);opacity:.45}
/* 10 SAN 越低，界面越发灰、越不稳。字仍然看得清 */
#app[data-san="1"] .chat,#app[data-san="1"] .status,#app[data-san="1"] .dock{filter:saturate(.7)}
#app[data-san="2"] .chat,#app[data-san="2"] .status,#app[data-san="2"] .dock{filter:saturate(.38)}
#app[data-san="3"] .chat,#app[data-san="3"] .status,#app[data-san="3"] .dock{filter:saturate(.12) contrast(1.06)}
#app[data-san="2"] .chat{animation:sway 7s ease-in-out infinite}
#app[data-san="3"] .chat{animation:sway 3.6s ease-in-out infinite}
#app[data-san="3"] .msg .bub{text-shadow:.7px 0 0 rgba(196,22,28,.32),-.7px 0 0 rgba(27,75,143,.32)}
@keyframes sway{0%,100%{transform:none}30%{transform:translateX(1.2px) rotate(.12deg)}65%{transform:translateX(-1px) rotate(-.1deg)}}

/* —— 不同设备 —— */
html,body{overscroll-behavior:none}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{height:100dvh}
.sys-top{padding-top:calc(10px + env(safe-area-inset-top))}
.status{padding-top:calc(8px + env(safe-area-inset-top))}
.title{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.sys,.board{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.msg>div:last-child{min-width:0;max-width:calc(100% - 92px)}
.msg .bub{max-width:100%}
.free input{font-size:16px}
.title h1{font-size:clamp(34px,11.5vw,44px)}
@media (pointer:coarse){
  .cell .pm button{width:36px;height:34px}
  .status .file{padding:5px 12px}
  .who-row button{padding:6px 12px}
  .seg button,.seg span{padding:8px 6px}
  .opt{padding:11px 12px}
  .go,.btn{padding:13px}
}
@media (max-width:359px){
  body{font-size:14px}
  .bars{gap:5px 10px}
  .cells{gap:5px}.cell{padding:5px 3px 6px}.cell .nm{font-size:12.5px}
  .mcard{grid-template-columns:92px minmax(0,1fr)}
  .mdetail{grid-template-columns:1fr}
  .thesis-page{padding:26px 18px 32px}
  .title{padding-left:20px;padding-right:20px}
  .status .term{font-size:13px}.status .row{gap:6px}.mood i{display:none}
  .mdetail .radar{max-width:180px;margin:0 auto}
}
@media (orientation:landscape) and (max-height:560px){
  #app{max-width:none}
  #app:has(>.chat){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  #app:has(>.chat)>.status{grid-column:1/-1}
  #app:has(>.chat)>.dock{overflow-y:auto;border-top:0;border-left:1px solid #dcdcdc;padding-right:calc(10px + env(safe-area-inset-right))}
  #app:has(>.chat)>.chat{padding-left:calc(10px + env(safe-area-inset-left))}
  .sys>*,.board>*{max-width:560px;margin-left:auto!important;margin-right:auto!important}
  .sys>.sys-top,.sys>.crumb,.board>.book{max-width:none}
  .sys>.btn{width:min(560px,100% - 24px)}
}
@media (max-height:760px) and (orientation:portrait){
  .status{padding-bottom:7px}.bars{gap:3px 14px;margin-top:5px}
  .chat{padding:8px 10px 12px}.msg{margin-bottom:8px}.msg .bub{padding:7px 10px}
  .dock{padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
  .opt{padding:9px 12px;margin-bottom:6px}
  .cell{padding:5px 6px 6px}.cell .sub{height:1.4em}
  .go{margin-top:7px;padding:11px}
}
@media (max-height:560px){
  .bars{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px 8px}
  .status{font-size:11.5px}
  .title h1{font-size:30px;margin-bottom:8px}.title p{margin-bottom:14px}.pool{display:none}
}
@media (min-width:560px) and (min-height:720px){
  body{display:flex;align-items:center;justify-content:center}
  #app{width:440px;height:min(100dvh - 48px,900px);border-radius:14px;box-shadow:0 0 0 1px var(--rule),0 24px 60px rgba(18,52,99,.22)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="js/content.js"></script>
<script src="js/engine.js"></script>
<script src="js/art.js"></script>
<script src="js/llm.js"></script>
<script src="js/ui.js"></script>
</body>
